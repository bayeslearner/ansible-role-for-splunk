# Splunk Virtual Lab - Task Runner
# =================================
# Single entry point for the Docker + Molecule testing harness.
# Run on the host with: task <command>
#
# Environments:
#   small  - 2 nodes (default)
#   prod   - 9 nodes (full cluster)
#   dev    - 1 node (all-in-one)
#
# Quick Start:
#   task setup
#   task workflow:full
#   MOLECULE_ENV=prod task infra:test

version: '3'

dotenv: ['.env']

vars:
  PROJECT_ROOT: '{{.TASKFILE_DIR}}/..'
  DOCKER_IMAGES_DIR: '{{.TASKFILE_DIR}}/docker-images'
  SECRETS_DIR: '{{.TASKFILE_DIR}}/.secrets'
  # Default environment - can be overridden via MOLECULE_ENV env var
  ENV: '{{.MOLECULE_ENV | default "small"}}'
  # Engine socket on the host; point it at a separate Podman API service when the default store is unsuitable
  DOCKER_SOCK: '{{.DOCKER_SOCK | default "/var/run/docker.sock"}}'
  # Address published lab ports bind to; widen with LAB_BIND_ADDRESS=0.0.0.0
  LAB_BIND_ADDRESS: '{{.LAB_BIND_ADDRESS | default "127.0.0.1"}}'
  # Common docker run args for molecule tasks (ENV resolved per-invocation)
  _DOCKER_ARGS: >-
    --cap-add NET_ADMIN
    -v {{.DOCKER_SOCK}}:/var/run/docker.sock
    -v {{.PROJECT_ROOT}}:/workspace
    -w /workspace/testing
    -e HOST_PROJECT_DIRECTORY={{.PROJECT_ROOT}}
    -e LAB_BIND_ADDRESS={{.LAB_BIND_ADDRESS}}
    -e MOLECULE_ENV={{.ENV}}
  # Disable veth checksum offloading before running molecule (prevents large file transfer corruption)
  _ETHTOOL_FIX: 'ethtool -K eth0 tx off rx off 2>/dev/null;'
  _MOL: 'docker run --rm {{._DOCKER_ARGS}} localhost/molecule-runner:latest bash -c "{{._ETHTOOL_FIX}} exec \$@" --'
  _MOL_NET: 'docker run --rm --network splunk-test-network {{._DOCKER_ARGS}} localhost/molecule-runner:latest bash -c "{{._ETHTOOL_FIX}} exec \$@" --'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Setup & Prereqs ===

  setup:
    desc: Complete environment setup (secrets + images + software + network)
    cmds:
      - task: setup:secrets
      - task: setup:images
      - task: download:splunk
      - task: network:create
      - echo "Environment setup complete!"
      - echo "Run 'task infra:test' (or 'MOLECULE_ENV=prod task infra:test') to start testing"

  setup:secrets:
    desc: Generate SSH keys and secrets (idempotent, runs on host)
    dir: "{{.PROJECT_ROOT}}/testing"
    cmds:
      - mkdir -p {{.SECRETS_DIR}}/inventory/group_vars
      - chmod 700 {{.SECRETS_DIR}}
      - test -f {{.SECRETS_DIR}}/id_rsa || ssh-keygen -t rsa -b 2048 -N '' -C 'splunk-test-cluster' -f {{.SECRETS_DIR}}/id_rsa
      - test -f {{.SECRETS_DIR}}/ansible_password || dd if=/dev/urandom bs=1 count=100 2>/dev/null | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 20 > {{.SECRETS_DIR}}/ansible_password
      - test -f {{.SECRETS_DIR}}/inventory/inventory.yml || printf '%s\n' "---" "all:" > {{.SECRETS_DIR}}/inventory/inventory.yml
      - |
        if [ ! -f {{.SECRETS_DIR}}/inventory/group_vars/all.yml ]; then
          ADMIN_PASS="$(dd if=/dev/urandom bs=1 count=200 2>/dev/null | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 20)"
          GITEA_KEY="$(dd if=/dev/urandom bs=1 count=200 2>/dev/null | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 40)"
          printf '%s\n' "---" "splunk_admin_password: ${ADMIN_PASS}" "gitea_secret_key: ${GITEA_KEY}" \
            > {{.SECRETS_DIR}}/inventory/group_vars/all.yml
        fi
      # ssh refuses a private key that others can read. A checkout that arrived through a file
      # sync (Dropbox and the like) loses the mode, so set it every time, not only at creation.
      - chmod 600 {{.SECRETS_DIR}}/id_rsa {{.SECRETS_DIR}}/ansible_password {{.SECRETS_DIR}}/inventory/group_vars/all.yml
      - echo "Secrets OK"
    status:
      - test -f {{.SECRETS_DIR}}/id_rsa
      - find {{.SECRETS_DIR}}/id_rsa -perm 600 | grep -q .
      - test -f {{.SECRETS_DIR}}/ansible_password
      - test -f {{.SECRETS_DIR}}/inventory/group_vars/all.yml

  # The lab's images are named localhost/<name>:latest. Docker and Podman both resolve that name to the
  # local image; a bare <name>:latest is read by Podman's Docker-compatible API as docker.io/library/<name>
  # and pulled, which fails.
  setup:images:
    desc: Build all Docker images required for testing (idempotent)
    cmds:
      - |
        echo "Checking/building Splunk testing framework images..."
        docker image inspect localhost/splunk-base-almalinux9:latest >/dev/null 2>&1 || docker build -t localhost/splunk-base-almalinux9:latest {{.DOCKER_IMAGES_DIR}}/almalinux9-systemd-sshd/
        docker image inspect localhost/splunk-base-ubuntu2204:latest >/dev/null 2>&1 || docker build -t localhost/splunk-base-ubuntu2204:latest {{.DOCKER_IMAGES_DIR}}/ubuntu2204-systemd-sshd/
        docker image inspect localhost/splunk-ansible-controller:latest >/dev/null 2>&1 || docker build -t localhost/splunk-ansible-controller:latest {{.DOCKER_IMAGES_DIR}}/ansible-controller/
        docker image inspect localhost/splunk-git-server:latest >/dev/null 2>&1 || docker build -t localhost/splunk-git-server:latest {{.DOCKER_IMAGES_DIR}}/git-server/
        docker image inspect localhost/molecule-runner:latest >/dev/null 2>&1 || docker build -t localhost/molecule-runner:latest {{.DOCKER_IMAGES_DIR}}/molecule-runner/
        echo "All images ready!"
    status:
      - docker image inspect localhost/splunk-base-almalinux9:latest >/dev/null 2>&1
      - docker image inspect localhost/splunk-base-ubuntu2204:latest >/dev/null 2>&1
      - docker image inspect localhost/splunk-ansible-controller:latest >/dev/null 2>&1
      - docker image inspect localhost/splunk-git-server:latest >/dev/null 2>&1
      - docker image inspect localhost/molecule-runner:latest >/dev/null 2>&1

  setup:rebuild:
    desc: Force rebuild all Docker images
    cmds:
      - docker build -t localhost/splunk-base-almalinux9:latest {{.DOCKER_IMAGES_DIR}}/almalinux9-systemd-sshd/
      - docker build -t localhost/splunk-base-ubuntu2204:latest {{.DOCKER_IMAGES_DIR}}/ubuntu2204-systemd-sshd/
      - docker build -t localhost/splunk-ansible-controller:latest {{.DOCKER_IMAGES_DIR}}/ansible-controller/
      - docker build -t localhost/splunk-git-server:latest {{.DOCKER_IMAGES_DIR}}/git-server/
      - docker build -t localhost/molecule-runner:latest {{.DOCKER_IMAGES_DIR}}/molecule-runner/
      - echo "All images rebuilt!"

  download:splunk:
    desc: "Download Splunk binaries using version from environment group_vars (idempotent)"
    cmds:
      - |
        docker run --rm \
          -v {{.PROJECT_ROOT}}:/workspace \
          -w /workspace/testing \
          -e MOLECULE_ENV={{.ENV}} \
          localhost/molecule-runner:latest \
          bash -c "ansible-playbook -e ansible_connection=local molecule/download.yml && chown -R $(id -u):$(id -g) /workspace/testing/software"

  network:create:
    desc: Create Docker network for testing (idempotent)
    cmds:
      - docker network ls | grep -q splunk-test-network || docker network create splunk-test-network
      - echo "Network splunk-test-network ready"
    status:
      - docker network ls | grep -q splunk-test-network

  # === Infra (Containers + SSH) ===

  infra:test:
    desc: "Run complete infra scenario (create, prepare, verify, destroy)"
    cmds:
      - task: setup
      - echo "Running infrastructure scenario with env={{.ENV}}..."
      - '{{._MOL}} molecule test -s infra'
      - echo "Infrastructure scenario complete!"

  infra:create:
    desc: "Create infrastructure containers"
    cmds:
      - task: setup
      - echo "Creating infrastructure containers with env={{.ENV}}..."
      - '{{._MOL}} molecule create -s infra'

  infra:prepare:
    desc: "Run prepare phase (SSH setup)"
    cmds:
      - echo "Running infra prepare phase with env={{.ENV}}..."
      - '{{._MOL}} molecule prepare -s infra'

  infra:setup:
    desc: "Setup infrastructure (create + prepare, keeps containers)"
    cmds:
      - task: infra:create
      - task: infra:prepare
      - echo "Infrastructure ready! Web terminal at http://localhost:3000/ttyd"

  infra:destroy:
    desc: "Destroy infrastructure containers"
    cmds:
      - echo "Destroying infrastructure containers..."
      - '{{._MOL}} molecule destroy -s infra'

  # === Day 0 (Deploy) ===

  day0:test:
    desc: "Run complete Day 0 scenario (converge, verify)"
    cmds:
      - echo "Day 0 - Running Splunk deployment with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule test -s day0 --destroy=never'
      - echo "Day 0 scenario complete!"

  day0:converge:
    desc: "Deploy Splunk via SSH"
    cmds:
      - echo "Day 0 - Deploying Splunk via SSH with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule converge -s day0'
      - echo "Day 0 deployment complete!"

  day0:verify:
    desc: "Verify Splunk deployment"
    cmds:
      - echo "Day 0 - Verifying Splunk deployment with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule verify -s day0'

  # === Day 1 (Ops) ===

  day1:test:
    desc: "Run complete Day 1 scenario (converge, verify)"
    cmds:
      - echo "Day 1 - Running operations scenario with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule test -s day1 --destroy=never'
      - echo "Day 1 scenario complete!"

  day1:converge:
    desc: "Run Day 1 operations"
    cmds:
      - echo "Day 1 - Running operational tasks with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule converge -s day1'
      - echo "Day 1 operations complete!"

  day1:verify:
    desc: "Verify Day 1 operations"
    cmds:
      - echo "Day 1 - Verifying operational tasks with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule verify -s day1'

  # === Workflows ===

  workflow:full:
    desc: "Full workflow (infra, day0, day1, destroy)"
    cmds:
      - task: infra:setup
      - task: day0:test
      - task: day1:test
      - task: infra:destroy
      - echo "Full workflow complete!"

  workflow:quick:
    desc: "Quick workflow (infra, day0, keeps containers)"
    cmds:
      - task: infra:setup
      - task: day0:test
      - echo "Quick workflow complete!"
      - echo "Run 'task infra:destroy' to clean up"

  # === Diagnostics ===

  diag:terminal:
    desc: "Check web terminal (ttyd/nginx) health; exits non-zero when it is down"
    cmds:
      - |
          set -e
          docker exec ansible-controller true 2>/dev/null || { echo "ansible-controller is not running - run: task infra:setup"; exit 1; }
          echo "=== Service status (ttyd, nginx) ==="
          docker exec ansible-controller systemctl is-active ttyd nginx
          echo "=== http://localhost:3000/ttyd/ without a password (401 expected) ==="
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/ttyd/ || true)
          echo "HTTP $code"
          [ "$code" = "401" ] || { echo "Expected 401 from the password prompt, got $code"; exit 1; }

  diag:ssh:
    desc: "Ping every node from the controller over SSH (uses the controller's ansible.cfg); exits non-zero on failure"
    cmds:
      - |
          set -e
          docker exec ansible-controller true 2>/dev/null || { echo "ansible-controller is not running - run: task infra:setup"; exit 1; }
          docker exec -u ansible -e ANSIBLE_CONFIG=/home/ansible/ansible.cfg ansible-controller \
            ansible 'all:!git_server:!ansible_controller' -m ansible.builtin.ping -o

  # === Utilities ===

  status:
    desc: "Show container status"
    cmds:
      - echo "Containers on splunk-test-network:"
      - docker ps --filter network=splunk-test-network

  shell:
    desc: "Shell into container (usage: task shell -- <container-name>)"
    cmds:
      - docker exec -it {{.CLI_ARGS}} bash

  # === Runner (Persistent Container) ===

  runner:start:
    desc: "Start persistent molecule-runner container"
    cmds:
      - |
        if docker ps --filter name=^mol-run$ --filter status=running -q | grep -q .; then
          echo "Molecule runner already running"
        else
          docker rm -f mol-run 2>/dev/null || true
          docker run -d --name mol-run --network splunk-test-network \
            {{._DOCKER_ARGS}} \
            localhost/molecule-runner:latest sleep infinity
          echo "Molecule runner started (use: task runner:shell)"
        fi

  runner:shell:
    desc: "Shell into a persistent molecule-runner (starts it when needed; stop it with runner:stop)"
    cmds:
      - task: network:create
      - task: runner:start
      - docker exec -it mol-run bash

  runner:stop:
    desc: "Stop molecule-runner"
    cmds:
      - docker rm -f mol-run 2>/dev/null || true
      - echo "Molecule runner stopped"

  # === Cleanup ===

  reset:
    desc: "Reset everything (destroy containers, remove test volumes and network)"
    cmds:
      - task: infra:destroy
      - task: runner:stop
      - echo "Removing test volumes and network..."
      - docker volume ls -q --filter name=ansible-splunk-test- | xargs -r docker volume rm
      - docker network rm splunk-test-network 2>/dev/null || true
      - echo "Reset complete!"
