# Splunk Virtual Lab - Task Runner
# =================================
# Single entry point for the Docker + Molecule testing harness.
# Run on the host with: task <command>
#
# Environments (MOLECULE_ENV):
#   small  - 2 Splunk nodes (default)
#   dev    - 1 node (all-in-one)
#   dms    - 1 node (all-in-one, newer Splunk)
#   prod   - 9 Splunk nodes and a Git server; forms an indexer cluster and a search head cluster
#
# A second lab on the same engine: LAB_NAME=<name> LAB_PORT_OFFSET=<n> on every command for it.
#
# Quick Start:
#   task setup
#   task workflow:full
#   MOLECULE_ENV=prod task infra:test

version: '3'

dotenv: ['.env']

vars:
  PROJECT_ROOT: '{{.TASKFILE_DIR}}/..'
  DOCKER_IMAGES_DIR: '{{.TASKFILE_DIR}}/docker-images'
  SECRETS_DIR: '{{.TASKFILE_DIR}}/.secrets'
  # Default environment - can be overridden via MOLECULE_ENV env var
  ENV: '{{.MOLECULE_ENV | default "small"}}'
  # Engine socket on the host; point it at a separate Podman API service when the default store is unsuitable
  DOCKER_SOCK: '{{.DOCKER_SOCK | default "/var/run/docker.sock"}}'
  # Address published lab ports bind to; widen with LAB_BIND_ADDRESS=0.0.0.0
  LAB_BIND_ADDRESS: '{{.LAB_BIND_ADDRESS | default "127.0.0.1"}}'
  # The lab's images are built and run as linux/amd64 on every host, because the role downloads
  # Splunk's x86_64 packages. On an ARM machine (Apple Silicon) the engine runs them emulated.
  # Without this, an ARM host builds arm64 images: the runner image then fails to build and
  # Splunk could not run in the node images.
  LAB_PLATFORM: '{{.LAB_PLATFORM | default "linux/amd64"}}'
  # Extra arguments for the runner container. On a host where SELinux is enforcing, a container may
  # not open the engine socket mounted into it; LAB_RUNNER_ARGS='--security-opt label=disable' lifts
  # that for the runner only.
  LAB_RUNNER_ARGS: '{{.LAB_RUNNER_ARGS | default ""}}'
  # A second lab on the same engine: LAB_NAME=<letters and digits> prefixes every container, gives
  # the lab its own network and volumes, and LAB_PORT_OFFSET moves its three published ports.
  # Empty (the default) keeps the names the lab has always used.
  LAB_NAME: '{{.LAB_NAME | default ""}}'
  LAB_PORT_OFFSET: '{{.LAB_PORT_OFFSET | default "0"}}'
  _PFX: '{{if .LAB_NAME}}{{.LAB_NAME}}-{{end}}'
  _NET: 'splunk-test-network{{if .LAB_NAME}}-{{.LAB_NAME}}{{end}}'
  _VOL: '{{if .LAB_NAME}}ansible-splunk-lab-{{.LAB_NAME}}-{{else}}ansible-splunk-test-{{end}}'
  _WEB_PORT: '{{add 3000 (atoi .LAB_PORT_OFFSET)}}'
  _LAB_NAME_OK: 'case "{{.LAB_NAME}}" in *[!a-z0-9]*) exit 1;; esac'
  # Common docker run args for molecule tasks (ENV resolved per-invocation)
  _DOCKER_ARGS: >-
    --cap-add NET_ADMIN
    {{.LAB_RUNNER_ARGS}}
    -v {{.DOCKER_SOCK}}:/var/run/docker.sock
    -v {{.PROJECT_ROOT}}:/workspace
    -w /workspace/testing
    -e HOST_PROJECT_DIRECTORY={{.PROJECT_ROOT}}
    -e LAB_BIND_ADDRESS={{.LAB_BIND_ADDRESS}}
    -e MOLECULE_ENV={{.ENV}}
    -e LAB_PREFIX={{._PFX}}
    -e LAB_NETWORK={{._NET}}
    -e LAB_VOLUME_STEM={{._VOL}}
    -e LAB_PORT_OFFSET={{.LAB_PORT_OFFSET}}
  # Disable veth checksum offloading before running molecule (prevents large file transfer corruption)
  _ETHTOOL_FIX: 'ethtool -K eth0 tx off rx off 2>/dev/null;'
  _MOL: 'docker run --rm --platform {{.LAB_PLATFORM}} {{._DOCKER_ARGS}} localhost/molecule-runner:latest bash -c "{{._ETHTOOL_FIX}} exec \$@" --'
  _MOL_NET: 'docker run --rm --platform {{.LAB_PLATFORM}} --network {{._NET}} {{._DOCKER_ARGS}} localhost/molecule-runner:latest bash -c "{{._ETHTOOL_FIX}} exec \$@" --'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Setup & Prereqs ===

  setup:
    desc: Complete environment setup (secrets + images + software + network)
    cmds:
      - task: setup:secrets
      - task: setup:images
      - task: download:splunk
      - task: network:create
      - echo "Environment setup complete!"
      - echo "Run 'task infra:test' (or 'MOLECULE_ENV=prod task infra:test') to start testing"

  setup:secrets:
    desc: Generate SSH keys and secrets (idempotent, runs on host)
    dir: "{{.PROJECT_ROOT}}/testing"
    cmds:
      - mkdir -p {{.SECRETS_DIR}}/inventory/group_vars
      - chmod 700 {{.SECRETS_DIR}}
      - test -f {{.SECRETS_DIR}}/id_rsa || ssh-keygen -t rsa -b 2048 -N '' -C 'splunk-test-cluster' -f {{.SECRETS_DIR}}/id_rsa
      - test -f {{.SECRETS_DIR}}/ansible_password || dd if=/dev/urandom bs=1 count=100 2>/dev/null | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 20 > {{.SECRETS_DIR}}/ansible_password
      - test -f {{.SECRETS_DIR}}/inventory/inventory.yml || printf '%s\n' "---" "all:" > {{.SECRETS_DIR}}/inventory/inventory.yml
      - |
        if [ ! -f {{.SECRETS_DIR}}/inventory/group_vars/all.yml ]; then
          ADMIN_PASS="$(dd if=/dev/urandom bs=1 count=200 2>/dev/null | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 20)"
          GITEA_KEY="$(dd if=/dev/urandom bs=1 count=200 2>/dev/null | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 40)"
          printf '%s\n' "---" "splunk_admin_password: ${ADMIN_PASS}" "gitea_secret_key: ${GITEA_KEY}" \
            > {{.SECRETS_DIR}}/inventory/group_vars/all.yml
        fi
      # ssh refuses a private key that others can read. A checkout that arrived through a file
      # sync (Dropbox and the like) loses the mode, so set it every time, not only at creation.
      - chmod 600 {{.SECRETS_DIR}}/id_rsa {{.SECRETS_DIR}}/ansible_password {{.SECRETS_DIR}}/inventory/group_vars/all.yml
      - echo "Secrets OK"
    status:
      - test -f {{.SECRETS_DIR}}/id_rsa
      - find {{.SECRETS_DIR}}/id_rsa -perm 600 | grep -q .
      - test -f {{.SECRETS_DIR}}/ansible_password
      - test -f {{.SECRETS_DIR}}/inventory/group_vars/all.yml

  # The lab's images are named localhost/<name>:latest. Docker and Podman both resolve that name to the
  # local image; a bare <name>:latest is read by Podman's Docker-compatible API as docker.io/library/<name>
  # and pulled, which fails.
  setup:images:
    desc: Build all Docker images required for testing (idempotent)
    cmds:
      - |
        echo "Checking/building Splunk testing framework images..."
        docker image inspect localhost/splunk-base-almalinux9:latest >/dev/null 2>&1 || docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-base-almalinux9:latest {{.DOCKER_IMAGES_DIR}}/almalinux9-systemd-sshd/
        docker image inspect localhost/splunk-base-ubuntu2204:latest >/dev/null 2>&1 || docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-base-ubuntu2204:latest {{.DOCKER_IMAGES_DIR}}/ubuntu2204-systemd-sshd/
        docker image inspect localhost/splunk-ansible-controller:latest >/dev/null 2>&1 || docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-ansible-controller:latest {{.DOCKER_IMAGES_DIR}}/ansible-controller/
        docker image inspect localhost/splunk-git-server:latest >/dev/null 2>&1 || docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-git-server:latest {{.DOCKER_IMAGES_DIR}}/git-server/
        docker image inspect localhost/molecule-runner:latest >/dev/null 2>&1 || docker build --platform {{.LAB_PLATFORM}} -t localhost/molecule-runner:latest {{.DOCKER_IMAGES_DIR}}/molecule-runner/
        echo "All images ready!"
    status:
      - docker image inspect localhost/splunk-base-almalinux9:latest >/dev/null 2>&1
      - docker image inspect localhost/splunk-base-ubuntu2204:latest >/dev/null 2>&1
      - docker image inspect localhost/splunk-ansible-controller:latest >/dev/null 2>&1
      - docker image inspect localhost/splunk-git-server:latest >/dev/null 2>&1
      - docker image inspect localhost/molecule-runner:latest >/dev/null 2>&1

  setup:rebuild:
    desc: Force rebuild all Docker images
    cmds:
      - docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-base-almalinux9:latest {{.DOCKER_IMAGES_DIR}}/almalinux9-systemd-sshd/
      - docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-base-ubuntu2204:latest {{.DOCKER_IMAGES_DIR}}/ubuntu2204-systemd-sshd/
      - docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-ansible-controller:latest {{.DOCKER_IMAGES_DIR}}/ansible-controller/
      - docker build --platform {{.LAB_PLATFORM}} -t localhost/splunk-git-server:latest {{.DOCKER_IMAGES_DIR}}/git-server/
      - docker build --platform {{.LAB_PLATFORM}} -t localhost/molecule-runner:latest {{.DOCKER_IMAGES_DIR}}/molecule-runner/
      - echo "All images rebuilt!"

  download:splunk:
    desc: "Download Splunk binaries using version from environment group_vars (idempotent)"
    cmds:
      - |
        docker run --rm --platform {{.LAB_PLATFORM}} \
          -v {{.PROJECT_ROOT}}:/workspace \
          -w /workspace/testing \
          -e MOLECULE_ENV={{.ENV}} \
          localhost/molecule-runner:latest \
          bash -c "ansible-playbook -e ansible_connection=local molecule/download.yml && chown -R $(id -u):$(id -g) /workspace/testing/software"

  network:create:
    desc: Create Docker network for testing (idempotent)
    preconditions:
      - sh: '{{._LAB_NAME_OK}}'
        msg: "LAB_NAME may hold only lower-case letters and digits (got '{{.LAB_NAME}}')"
    cmds:
      - docker network inspect {{._NET}} >/dev/null 2>&1 || docker network create {{._NET}}
      - echo "Network {{._NET}} ready"
    status:
      - docker network inspect {{._NET}} >/dev/null 2>&1

  # === Infra (Containers + SSH) ===

  infra:test:
    desc: "Run complete infra scenario (create, prepare, verify, destroy)"
    cmds:
      - task: setup
      - echo "Running infrastructure scenario with env={{.ENV}}..."
      - '{{._MOL}} molecule test -s infra'
      - echo "Infrastructure scenario complete!"

  lab:ports:
    desc: "Stop when a port the lab is about to publish is already in use on this machine"
    preconditions:
      - sh: '{{._LAB_NAME_OK}}'
        msg: "LAB_NAME may hold only lower-case letters and digits (got '{{.LAB_NAME}}')"
      - sh: |
          docker inspect {{._PFX}}ansible-controller >/dev/null 2>&1 && exit 0
          # curl exits 7 when nothing listens; any other result means something answered or held the port
          if curl -s -o /dev/null --max-time 3 http://127.0.0.1:{{._WEB_PORT}}/; then exit 1; else [ $? -eq 7 ]; fi
        msg: "Port {{._WEB_PORT}} on this machine is already in use, so the lab's web terminal would not be reachable there. Pick another LAB_PORT_OFFSET (now {{.LAB_PORT_OFFSET}}); it also moves the Git server's ports {{add 2222 (atoi .LAB_PORT_OFFSET)}} and {{add 8929 (atoi .LAB_PORT_OFFSET)}}."
      - sh: |
          # Only a topology with a Git server publishes these two ports
          grep -q "git_server:" molecule/environments/{{.ENV}}/hosts.yml || exit 0
          docker inspect {{._PFX}}git-server >/dev/null 2>&1 && exit 0
          for p in {{add 2222 (atoi .LAB_PORT_OFFSET)}} {{add 8929 (atoi .LAB_PORT_OFFSET)}}; do
            if curl -s -o /dev/null --max-time 3 http://127.0.0.1:$p/; then exit 1; else [ $? -eq 7 ] || exit 1; fi
          done
        msg: "Port {{add 2222 (atoi .LAB_PORT_OFFSET)}} or {{add 8929 (atoi .LAB_PORT_OFFSET)}} on this machine is already in use, so the lab's Git server would not be reachable there. Pick another LAB_PORT_OFFSET (now {{.LAB_PORT_OFFSET}})."

  infra:create:
    desc: "Create infrastructure containers"
    cmds:
      - task: lab:ports
      - task: setup
      - echo "Creating infrastructure containers with env={{.ENV}}..."
      - '{{._MOL}} molecule create -s infra'

  infra:prepare:
    desc: "Run prepare phase (SSH setup)"
    cmds:
      - echo "Running infra prepare phase with env={{.ENV}}..."
      - '{{._MOL}} molecule prepare -s infra'

  infra:setup:
    desc: "Setup infrastructure (create + prepare, keeps containers)"
    cmds:
      - task: infra:create
      - task: infra:prepare
      - echo "Infrastructure ready! Web terminal at http://localhost:{{._WEB_PORT}}/ttyd"

  infra:destroy:
    desc: "Destroy infrastructure containers"
    cmds:
      - echo "Destroying infrastructure containers..."
      - '{{._MOL}} molecule destroy -s infra'

  # === Day 0 (Deploy) ===

  day0:test:
    desc: "Run complete Day 0 scenario (converge, verify)"
    cmds:
      - echo "Day 0 - Running Splunk deployment with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule test -s day0 --destroy=never'
      - echo "Day 0 scenario complete!"

  day0:converge:
    desc: "Deploy Splunk via SSH"
    cmds:
      - echo "Day 0 - Deploying Splunk via SSH with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule converge -s day0'
      - echo "Day 0 deployment complete!"

  day0:verify:
    desc: "Verify Splunk deployment"
    cmds:
      - echo "Day 0 - Verifying Splunk deployment with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule verify -s day0'

  # === Day 1 (Ops) ===

  day1:test:
    desc: "Run complete Day 1 scenario (converge, verify)"
    cmds:
      - echo "Day 1 - Running operations scenario with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule test -s day1 --destroy=never'
      - echo "Day 1 scenario complete!"

  day1:converge:
    desc: "Run Day 1 operations"
    cmds:
      - echo "Day 1 - Running operational tasks with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule converge -s day1'
      - echo "Day 1 operations complete!"

  day1:verify:
    desc: "Verify Day 1 operations"
    cmds:
      - echo "Day 1 - Verifying operational tasks with env={{.ENV}}..."
      - '{{._MOL_NET}} molecule verify -s day1'

  # === Workflows ===

  workflow:full:
    desc: "Full workflow (infra, day0, day1, destroy)"
    cmds:
      - task: infra:setup
      - task: day0:test
      - task: day1:test
      - task: infra:destroy
      - echo "Full workflow complete!"

  workflow:quick:
    desc: "Quick workflow (infra, day0, keeps containers)"
    cmds:
      - task: infra:setup
      - task: day0:test
      - echo "Quick workflow complete!"
      - echo "Run 'task infra:destroy' to clean up"

  # === Diagnostics ===

  diag:terminal:
    desc: "Check web terminal (ttyd/nginx) health; exits non-zero when it is down"
    cmds:
      - |
          set -e
          docker exec {{._PFX}}ansible-controller true 2>/dev/null || { echo "{{._PFX}}ansible-controller is not running - run: task infra:setup"; exit 1; }
          echo "=== Service status (ttyd, nginx) ==="
          docker exec {{._PFX}}ansible-controller systemctl is-active ttyd nginx
          echo "=== http://localhost:{{._WEB_PORT}}/ttyd/ without a password (401 expected) ==="
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:{{._WEB_PORT}}/ttyd/ || true)
          echo "HTTP $code"
          [ "$code" = "401" ] || { echo "Expected 401 from the password prompt, got $code"; exit 1; }

  diag:ssh:
    desc: "Ping every node from the controller over SSH (uses the controller's ansible.cfg); exits non-zero on failure"
    cmds:
      - |
          set -e
          docker exec {{._PFX}}ansible-controller true 2>/dev/null || { echo "{{._PFX}}ansible-controller is not running - run: task infra:setup"; exit 1; }
          docker exec -u ansible -e ANSIBLE_CONFIG=/home/ansible/ansible.cfg {{._PFX}}ansible-controller \
            ansible 'all:!git_server:!ansible_controller' -m ansible.builtin.ping -o

  # === Utilities ===

  status:
    desc: "Show container status"
    cmds:
      - echo "Containers on {{._NET}}:"
      - docker ps --filter network={{._NET}}

  shell:
    desc: "Shell into container (usage: task shell -- <container-name>)"
    cmds:
      - docker exec -it {{._PFX}}{{.CLI_ARGS}} bash

  # === Runner (Persistent Container) ===

  runner:start:
    desc: "Start persistent molecule-runner container"
    cmds:
      - |
        if docker ps --filter name=^{{._PFX}}mol-run$ --filter status=running -q | grep -q .; then
          echo "Molecule runner already running"
        else
          docker rm -f {{._PFX}}mol-run 2>/dev/null || true
          docker run -d --platform {{.LAB_PLATFORM}} --name {{._PFX}}mol-run --network {{._NET}} \
            {{._DOCKER_ARGS}} \
            localhost/molecule-runner:latest sleep infinity
          echo "Molecule runner started (use: task runner:shell)"
        fi

  runner:shell:
    desc: "Shell into a persistent molecule-runner (starts it when needed; stop it with runner:stop)"
    cmds:
      - task: network:create
      - task: runner:start
      - docker exec -it {{._PFX}}mol-run bash

  runner:stop:
    desc: "Stop molecule-runner"
    cmds:
      - docker rm -f {{._PFX}}mol-run 2>/dev/null || true
      - echo "Molecule runner stopped"

  # === Cleanup ===

  reset:
    desc: "Reset everything (destroy containers, remove test volumes and network)"
    cmds:
      - task: infra:destroy
      - task: runner:stop
      # infra:destroy removes the hosts of the topology MOLECULE_ENV names now. A lab built from
      # another topology would be left behind, so remove whatever is still on this lab's network.
      - |
        left=$(docker network inspect {{._NET}} --format '{{"{{"}}range .Containers{{"}}"}}{{"{{"}}.Name{{"}}"}} {{"{{"}}end{{"}}"}}' 2>/dev/null || true)
        if [ -n "$left" ]; then echo "Removing containers left on {{._NET}}: $left"; docker rm -f $left; fi
      - echo "Removing test volumes and network..."
      - docker volume ls -q --filter name={{._VOL}} | xargs -r docker volume rm
      - docker network rm {{._NET}} 2>/dev/null || true
      - echo "Reset complete!"
