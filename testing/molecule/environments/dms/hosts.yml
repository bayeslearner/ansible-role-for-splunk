---
# Data Management API environment - single all-in-one Splunk Enterprise 10.6 node
# The DMS API app (dmx_cmp) needs Splunk Enterprise 10.6.0 or later
all:
  vars:
    ansible_user: ansible
  children:
    full:
      children:
        licensemaster:
          hosts:
            splunk-dms:
              # All-in-one: License master + Search Head + Indexer

        indexer:
          hosts:
            splunk-dms:

        search:
          hosts:
            splunk-dms:

    ansible_controller:
      hosts:
        ansible-controller:
          ansible_user: ansible
