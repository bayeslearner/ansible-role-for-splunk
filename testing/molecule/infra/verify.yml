---
# Verify infrastructure is ready
- hosts: full:!git_server:!ansible_controller
  gather_facts: false
  vars:
    ansible_connection: docker  # Use Docker for verification (not SSH)
    # The Docker connection addresses a container by its real name, which a named lab prefixes.
    ansible_host: "{{ lookup('env', 'LAB_PREFIX') }}{{ inventory_hostname }}"
  tasks:
    - name: Test infrastructure setup
      ansible.builtin.command: echo "Infrastructure setup verified - containers created and SSH keys distributed to {{ inventory_hostname }}"
      register: infra_test

    - name: Display infrastructure test result
      ansible.builtin.debug:
        msg: "{{ infra_test.stdout }}"

    - name: Read PID 1 comm
      ansible.builtin.command: cat /proc/1/comm
      register: pid1_comm
      changed_when: false

    - name: Assert systemd is running as PID 1
      ansible.builtin.assert:
        that:
          - pid1_comm.stdout | trim == 'systemd'
        fail_msg: "Expected PID 1 to be systemd, got: {{ pid1_comm.stdout | trim | default('') }}"


# The lab's point is that the controller reaches every node over SSH as `ansible`.
# Check it here, so a broken key or sshd fails infra and not day0.
- name: Verify SSH from the controller to every node
  hosts: ansible_controller
  gather_facts: false
  vars:
    ansible_connection: docker
    # The Docker connection addresses a container by its real name, which a named lab prefixes.
    ansible_host: "{{ lookup('env', 'LAB_PREFIX') }}{{ inventory_hostname }}"
    ansible_user: root
    lab_git_owner: test
    lab_git_apps: >-
      {{ groups['all'] | map('extract', hostvars, 'git_apps') | select('defined') | flatten
         | map(attribute='name') | unique | sort | list }}
  tasks:
    # The runner executes this play, so `ansible_version` is the runner's. The two images pin the
    # same ansible-core; a difference means one Dockerfile was changed without the other.
    - name: Read the controller's ansible-core version
      ansible.builtin.command: ansible --version
      register: controller_ansible
      changed_when: false

    - name: Assert the controller and the runner run the same ansible-core
      ansible.builtin.assert:
        that:
          - "('[core ' ~ ansible_version.full ~ ']') in controller_ansible.stdout_lines[0]"
        success_msg: "Runner and controller both run ansible-core {{ ansible_version.full }}"
        fail_msg: "Runner runs ansible-core {{ ansible_version.full }}; the controller reports: {{ controller_ansible.stdout_lines[0] }}"

    - name: Ping every node from the controller as the ansible user
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - ansible
          - "-c"
          - "ANSIBLE_CONFIG=/home/ansible/ansible.cfg ansible 'all:!git_server:!ansible_controller' -m ansible.builtin.ping -o"
      register: controller_ping
      changed_when: false
      failed_when: false

    - name: Assert every node answered over SSH
      ansible.builtin.assert:
        that:
          - controller_ping.rc == 0
        success_msg: "The controller reached every node over SSH as ansible"
        fail_msg: |
          The controller could not reach every node over SSH as ansible:
          {{ controller_ping.stdout }}
          {{ controller_ping.stderr }}

    # Only a topology with a Git server names app repositories (git_apps). The role clones each
    # one as "<git_server>/<git_project>/<app name>" with the lab key, so check exactly that.
    - name: List each app repository from the controller over SSH
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - ansible
          - "-c"
          - >-
            GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
            git ls-remote --heads {{ git_server }}/{{ lab_git_owner }}/{{ item }} main
      loop: "{{ lab_git_apps }}"
      register: controller_git
      changed_when: false
      failed_when: false
      when: groups['git_server'] | default([]) | length > 0

    - name: Assert every app repository has a main branch the lab key can read
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - "'refs/heads/main' in item.stdout"
        quiet: true
        fail_msg: "{{ git_server }}/{{ lab_git_owner }}/{{ item.item }} is not readable from the controller: {{ item.stderr | default('') }}"
      loop: "{{ controller_git.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: groups['git_server'] | default([]) | length > 0
