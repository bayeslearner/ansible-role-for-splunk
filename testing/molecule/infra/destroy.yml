---
# Destroy containers using Ansible
# Dynamically destroys containers based on environment inventory
- hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/local/bin/python3
    targets: "{{ groups['full'] | default([]) + groups['uf'] | default([]) + groups['git_server'] | default([]) }}"
    lab_prefix: "{{ lookup('env', 'LAB_PREFIX') }}"
    lab_volume_stem: "{{ lookup('env', 'LAB_VOLUME_STEM') | default('ansible-splunk-test-', true) }}"
  tasks:
    - name: Stop and remove ansible-controller
      community.docker.docker_container:
        name: "{{ lab_prefix }}ansible-controller"
        state: absent
        force_kill: true
      ignore_errors: true

    - name: Stop and remove Splunk containers
      community.docker.docker_container:
        name: "{{ lab_prefix }}{{ item }}"
        state: absent
        force_kill: true
      loop: "{{ targets | reject('equalto', 'git-server') | list }}"
      loop_control:
        label: "{{ item }}"
      ignore_errors: true

    # A node keeps Splunk under /opt in a named volume, but its systemd unit lives in the container.
    # A volume that outlives its container makes the next day0 fail the role's boot-start check,
    # so a destroyed node takes its volume with it. The Git server's data volume is kept.
    - name: Remove the Splunk nodes' data volumes
      community.docker.docker_volume:
        name: "{{ lab_volume_stem }}{{ item }}-data"
        state: absent
      loop: "{{ targets | reject('equalto', 'git-server') | list }}"
      loop_control:
        label: "{{ item }}"

    - name: Stop and remove git-server
      community.docker.docker_container:
        name: "{{ lab_prefix }}git-server"
        state: absent
        force_kill: true
      ignore_errors: true
