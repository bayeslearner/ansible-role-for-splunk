---
# Infrastructure Preparation - SSH Setup
# Sets up SSH connectivity between ansible-controller and all Splunk containers

# Read secrets from molecule-runner (localhost), where /workspace is bind-mounted.
# Target containers do not have /workspace, so secrets must be read here first.
- name: Read secrets from molecule-runner
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check that the lab secrets exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /workspace/testing/.secrets/id_rsa
        - /workspace/testing/.secrets/id_rsa.pub
        - /workspace/testing/.secrets/ansible_password
      register: secrets_stat

    - name: Stop with the fix when a secret is missing
      ansible.builtin.assert:
        that:
          - secrets_stat.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: |
          Missing lab secrets: {{ secrets_stat.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
          Create them with:  task setup   (run from testing/)
        quiet: true

    - name: Slurp SSH keys and password
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /workspace/testing/.secrets/id_rsa
        - /workspace/testing/.secrets/id_rsa.pub
        - /workspace/testing/.secrets/ansible_password
      register: secrets_slurp

    - name: Expose secrets as facts
      ansible.builtin.set_fact:
        runner_private_key: "{{ (secrets_slurp.results | selectattr('item', 'equalto', '/workspace/testing/.secrets/id_rsa') | first).content | b64decode }}"
        runner_public_key: "{{ (secrets_slurp.results | selectattr('item', 'equalto', '/workspace/testing/.secrets/id_rsa.pub') | first).content | b64decode }}"
        ansible_plain_password: "{{ (secrets_slurp.results | selectattr('item', 'equalto', '/workspace/testing/.secrets/ansible_password') | first).content | b64decode | trim }}"

- name: Setup SSH Infrastructure
  hosts: all:!git_server
  gather_facts: true
  connection: docker
  become: true
  become_user: root
  vars:
    ansible_connection: docker  # Override inventory SSH setting for prepare phase
    ansible_user: root
    # Some base images can have restrictive/odd $HOME perms for root; force tmp into /tmp.
    ansible_remote_tmp: /tmp/.ansible/tmp
    runner_public_key: "{{ hostvars['localhost'].runner_public_key }}"
    runner_private_key: "{{ hostvars['localhost'].runner_private_key }}"
    ansible_plain_password: "{{ hostvars['localhost'].ansible_plain_password }}"
  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.wait_for:
        path: /run/systemd/system
      when: ansible_service_mgr == "systemd" and inventory_hostname != 'ansible-controller'
      tags: [ssh]

    - name: Disable veth checksum offloading (prevents large file transfer corruption)
      ansible.builtin.command: ethtool -K eth0 tx off rx off
      changed_when: false
      failed_when: false

    - name: Set up SSH infrastructure for all Splunk hosts
      tags: [ssh_keys]
      block:
        - name: Start SSH service
          ansible.builtin.systemd:
            name: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"
            state: started
            enabled: true
          when: inventory_hostname != 'ansible-controller'

        - name: Create ansible user SSH directory
          ansible.builtin.file:
            path: /home/ansible/.ssh
            state: directory
            owner: ansible
            group: ansible
            mode: '0700'

    - name: Set up SSH infrastructure for all hosts
      block:
        - name: Copy SSH public key to authorized_keys
          ansible.builtin.copy:
            content: "{{ runner_public_key }}"
            dest: /home/ansible/.ssh/authorized_keys
            owner: ansible
            group: ansible
            mode: '0600'

        - name: Configure SSH client settings
          ansible.builtin.blockinfile:
            path: /home/ansible/.ssh/config
            create: true
            owner: ansible
            group: ansible
            mode: '0600'
            block: |
              Host *
                StrictHostKeyChecking no
                UserKnownHostsFile /dev/null
                LogLevel ERROR

        - name: Create test data directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - /var/log/test-data
            - /tmp/test-logs
          when: (groups['uf'] is defined and inventory_hostname in groups['uf']) and ansible_distribution != 'Ubuntu' and ansible_distribution != 'AlmaLinux'

        - name: Ensure Splunk user and group exist
          block:
            - name: Create splunk group
              ansible.builtin.group:
                name: splunk
                state: present
                local: false
              when: splunk_nix_user | default('splunk') != 'root'

            - name: Check for splunk user
              ansible.builtin.command: id -u splunk
              register: splunk_user_id
              changed_when: false
              failed_when: false

            - name: Create splunk user
              ansible.builtin.user:
                name: splunk
                group: splunk
                home: /home/splunk
                state: present
                shell: /bin/bash
                local: false
                create_home: true
              when:
                - splunk_nix_user | default('splunk') != 'root'
                - splunk_user_id.rc != 0

            - name: Ensure splunk user has sudo access
              ansible.builtin.lineinfile:
                path: /etc/sudoers.d/splunk
                create: true
                mode: '0440'
                line: 'splunk ALL=(ALL) NOPASSWD: ALL'
                validate: 'visudo -cf %s'
              when: splunk_nix_user | default('splunk') != 'root'
          when: inventory_hostname != 'ansible-controller' and inventory_hostname != 'git-server'

    - name: Permit user logins on systemd hosts (clear pam_nologin gate)
      block:
        - name: Remove /run/nologin if present
          ansible.builtin.file:
            path: /run/nologin
            state: absent

        - name: Start systemd-user-sessions (opens user logins)
          ansible.builtin.systemd:
            name: systemd-user-sessions
            state: started
            daemon_reload: true
          when: ansible_distribution != 'AlmaLinux'

        - name: Enable systemd-user-sessions at boot (ignore if static)
          ansible.builtin.systemd:
            name: systemd-user-sessions
            enabled: true
      when: ansible_service_mgr == "systemd"

    - name: Configure Ansible Controller
      block:
        - name: Start SSH service on controller
          ansible.builtin.systemd:
            name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
            state: started
            enabled: true
          tags: [controller, ssh]

        - name: Ensure ansible SSH directory on controller
          ansible.builtin.file:
            path: /home/ansible/.ssh
            state: directory
            mode: '0700'
            owner: ansible
            group: ansible
          tags: [controller, ssh_keys]

        - name: Create ttyd service file
          ansible.builtin.copy:
            dest: /etc/systemd/system/ttyd.service
            content: |
              [Unit]
              Description=ttyd Web Terminal Service
              After=network.target

              [Service]
              Type=simple
              User=ansible
              Group=ansible
              WorkingDirectory=/home/ansible
              ExecStart=/usr/local/bin/ttyd -p 7681 -i 127.0.0.1 --writable -t fontSize=14 -t theme={"background":"#000000"} -c ansible:{{ ansible_plain_password }} /bin/bash
              Restart=always
              RestartSec=3
              StandardOutput=syslog
              StandardError=syslog
              SyslogIdentifier=ttyd

              [Install]
              WantedBy=multi-user.target
          tags: [controller, ttyd]

        - name: Enable ttyd service
          ansible.builtin.systemd:
            name: ttyd
            enabled: true
            daemon_reload: true
          tags: [controller, ttyd]

        - name: Copy SSH keys to controller /home/ansible/.ssh
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
            owner: ansible
            group: ansible
          loop:
            - { content: "{{ runner_private_key }}", dest: /home/ansible/.ssh/id_rsa, mode: '0600' }
            - { content: "{{ runner_public_key }}", dest: /home/ansible/.ssh/id_rsa.pub, mode: '0644' }
          tags: [controller, ssh_keys]

        - name: Install controller authorized_keys
          ansible.builtin.copy:
            content: "{{ runner_public_key }}"
            dest: /home/ansible/.ssh/authorized_keys
            mode: '0600'
            owner: ansible
            group: ansible
          tags: [controller, ssh_keys]

        - name: Create ansible controller SSH config
          ansible.builtin.copy:
            content: |
              Host *
                StrictHostKeyChecking no
                UserKnownHostsFile /dev/null
                LogLevel ERROR
            dest: /home/ansible/.ssh/config
            mode: '0600'
            owner: ansible
            group: ansible
          tags: [controller, ssh_keys]

        - name: Determine MOLECULE_ENV
          ansible.builtin.set_fact:
            _molecule_env: "{{ lookup('env', 'MOLECULE_ENV') | default('small', true) }}"
          tags: [controller, ansible_cfg]

        - name: Deploy ansible.cfg on controller
          ansible.builtin.copy:
            content: |
              [defaults]
              inventory = /workspace/testing/.secrets/inventory/,/workspace/testing/molecule/environments/common/,/workspace/testing/molecule/environments/{{ _molecule_env }}/
              roles_path = /workspace/roles
              host_key_checking = False
              deprecation_warnings = False

              [ssh_connection]
              ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o Compression=no -o TCPKeepAlive=yes
              transfer_method = scp
            dest: /home/ansible/ansible.cfg
            owner: ansible
            group: ansible
            mode: '0644'
          tags: [controller, ansible_cfg]

        - name: Set ANSIBLE_CONFIG in ansible user profile
          ansible.builtin.lineinfile:
            path: /home/ansible/.bashrc
            line: 'export ANSIBLE_CONFIG=/home/ansible/ansible.cfg'
            create: true
            owner: ansible
            group: ansible
            mode: '0644'
          tags: [controller, ansible_cfg]

        - name: Ensure nginx sites directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - /etc/nginx/sites-available
            - /etc/nginx/sites-enabled
          tags: [controller, nginx]

        - name: Disable default nginx site if present
          ansible.builtin.file:
            path: /etc/nginx/sites-enabled/default
            state: absent
          tags: [controller, nginx]

        - name: Ensure ttyd is running
          ansible.builtin.systemd:
            name: ttyd
            state: started
            enabled: true
          tags: [controller, ttyd]

        - name: Ensure nginx is running
          ansible.builtin.systemd:
            name: nginx
            state: started
            enabled: true
          tags: [controller, nginx]

      when: inventory_hostname == 'ansible-controller'
      tags: [controller]

- name: Bootstrap Git Server
  hosts: git_server
  gather_facts: false
  connection: docker
  vars:
    ansible_connection: docker
    # The Gitea image has no Python, so every task is a raw shell command inside the container.
    # The role clones "<git_server>/<git_project>/<app name>", so each app is its own repository
    # under one owner. The owner name and the app names come from the inventory's git_apps.
    lab_git_owner: test
    lab_git_apps: >-
      {{ groups['all'] | map('extract', hostvars, 'git_apps') | select('defined') | flatten
         | map(attribute='name') | unique | sort | list }}
    lab_git_api: http://localhost:8929/api/v1
    lab_git_auth: "{{ lab_git_owner }}:{{ splunk_admin_password }}"
    runner_public_key: "{{ hostvars['localhost'].runner_public_key }}"
    # The seed app's default/app.conf; `item` is the app name in the seeding loop.
    lab_git_app_conf: |
      [ui]
      is_visible = false
      label = {{ item }}

      [launcher]
      version = 1.0.0
      description = Lab app {{ item }}
  tasks:
    - name: Wait for Gitea to answer
      ansible.builtin.raw: >-
        sh -c 'for i in $(seq 1 60); do curl -fs {{ lab_git_api }}/version >/dev/null && exit 0; sleep 2; done; exit 1'
      changed_when: false

    # `gitea admin` must run as the git user. A second run finds the user and moves on.
    - name: Create the repository owner
      ansible.builtin.raw: >-
        su-exec git gitea admin user create --username {{ lab_git_owner }}
        --password '{{ splunk_admin_password }}' --email {{ lab_git_owner }}@lab.invalid
        --must-change-password=false
        || su-exec git gitea admin user list | grep -qw {{ lab_git_owner }}
      no_log: true
      changed_when: false

    # Add the key only when it is not there yet, and accept nothing but "created" (201):
    # Gitea answers 422 both for a duplicate and for a key it rejects.
    - name: List the owner's SSH keys
      ansible.builtin.raw: curl -s -u '{{ lab_git_auth }}' {{ lab_git_api }}/user/keys
      register: lab_git_keys
      no_log: true
      changed_when: false

    - name: Give the owner the lab SSH key, so the role can clone as git@git-server
      ansible.builtin.raw: >-
        curl -s -o /dev/null -w '%{http_code}' -u '{{ lab_git_auth }}' -H 'Content-Type: application/json'
        -X POST {{ lab_git_api }}/user/keys
        -d '{{ {"title": "lab key", "key": runner_public_key | trim, "read_only": true} | to_json }}'
      register: lab_git_key
      no_log: true
      when: "'lab key' not in (lab_git_keys.stdout | from_json | map(attribute='title') | list)"
      failed_when: lab_git_key.stdout | trim != '201'

    # 201 = created; 409 = the repository already exists.
    - name: Create one repository per app the inventory names
      ansible.builtin.raw: >-
        curl -s -o /dev/null -w '%{http_code}' -u '{{ lab_git_auth }}' -H 'Content-Type: application/json'
        -X POST {{ lab_git_api }}/user/repos
        -d '{{ {"name": item, "auto_init": true, "default_branch": "main", "private": false} | to_json }}'
      loop: "{{ lab_git_apps }}"
      register: lab_git_repo
      no_log: true
      changed_when: "'201' in lab_git_repo.stdout"
      failed_when: lab_git_repo.stdout | trim not in ['201', '409']

    # A Splunk app needs at least default/app.conf. 201 = created; 422 = the file is already there.
    - name: Seed each repository with a minimal Splunk app
      ansible.builtin.raw: >-
        curl -s -o /dev/null -w '%{http_code}' -u '{{ lab_git_auth }}' -H 'Content-Type: application/json'
        -X POST {{ lab_git_api }}/repos/{{ lab_git_owner }}/{{ item }}/contents/default/app.conf
        -d '{{ {"branch": "main", "message": "Seed the lab app", "content": lab_git_app_conf | b64encode} | to_json }}'
      loop: "{{ lab_git_apps }}"
      register: lab_git_seed
      no_log: true
      changed_when: "'201' in lab_git_seed.stdout"
      failed_when: lab_git_seed.stdout | trim not in ['201', '422']
