---
# Create containers using Ansible
# Dynamically creates containers based on environment inventory
- hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/local/bin/python3
    targets: "{{ groups['full'] | default([]) + groups['uf'] | default([]) + groups['git_server'] | default([]) + groups['ansible_controller'] | default([]) }}"
    # Bind address for published ports, passed in by the Taskfile
    lab_bind_address: "{{ lookup('env', 'LAB_BIND_ADDRESS') | default('127.0.0.1', true) }}"
    # A named lab (LAB_NAME in the Taskfile) prefixes its container names and has its own network,
    # volumes and published ports. Inside its network every container keeps its inventory name as
    # an alias, so the inventory and the role see the same host names in every lab.
    lab_prefix: "{{ lookup('env', 'LAB_PREFIX') }}"
    lab_network: "{{ lookup('env', 'LAB_NETWORK') | default('splunk-test-network', true) }}"
    lab_volume_stem: "{{ lookup('env', 'LAB_VOLUME_STEM') | default('ansible-splunk-test-', true) }}"
    lab_port_offset: "{{ lookup('env', 'LAB_PORT_OFFSET') | default('0', true) | int }}"

  tasks:
    # The lab's hosts are reached by container name. If the machine running the lab can already
    # resolve one of those names (through its DNS search domains, for example), a playbook run from
    # outside the lab network could reach a real host of the same name. This runner is not on the
    # lab network during infra, so a name that resolves here resolves to something outside the lab.
    - name: Look up each lab host name outside the lab network
      ansible.builtin.command: getent hosts {{ item }}
      loop: "{{ targets }}"
      register: lab_name_lookup
      changed_when: false
      failed_when: false

    - name: Refuse lab host names that already resolve to something else
      ansible.builtin.assert:
        that:
          - lab_name_lookup.results | selectattr('rc', 'equalto', 0) | list | length == 0
        quiet: true
        fail_msg: |
          These lab host names already resolve outside the lab, so they could reach a real host:
          {{ lab_name_lookup.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | join('; ') }}
          Rename them in the topology's hosts.yml, or run the lab where they do not resolve.

    - name: Ensure Docker network exists
      community.docker.docker_network:
        name: "{{ lab_network }}"
        state: present

    - name: Start ansible-controller
      community.docker.docker_container:
        name: "{{ lab_prefix }}ansible-controller"
        image: localhost/splunk-ansible-controller:latest
        hostname: ansible-controller
        privileged: true
        cgroupns_mode: host
        command: /usr/sbin/init
        networks:
          - name: "{{ lab_network }}"
            aliases: [ansible-controller]
        published_ports:
          - "{{ lab_bind_address }}:{{ 3000 + lab_port_offset | int }}:3000"
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
          - "{{ lookup('env', 'HOST_PROJECT_DIRECTORY') }}:/workspace:rw"
          - "{{ lookup('env', 'HOST_PROJECT_DIRECTORY') }}/testing/.secrets:/workspace/testing/.secrets:ro"
        tmpfs:
          - /run
          - /tmp
        restart_policy: unless-stopped
        state: started
      when: "'ansible_controller' in groups"

    - name: Start Splunk containers
      community.docker.docker_container:
        name: "{{ lab_prefix }}{{ item }}"
        image: "{{ hostvars[item].docker_image | default('localhost/splunk-base-ubuntu2204:latest') }}"
        hostname: "{{ item }}"
        privileged: true
        cgroupns_mode: host
        command: /usr/sbin/init
        networks:
          - name: "{{ lab_network }}"
            aliases: ["{{ item }}"]
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
          - "{{ lab_volume_stem }}{{ item }}-data:/opt:rw"
        tmpfs:
          - /run
          - /run/lock
          - /tmp
        restart_policy: unless-stopped
        state: started
      loop: "{{ targets | reject('equalto', 'git-server') | reject('equalto', 'ansible-controller') | list }}"
      loop_control:
        label: "{{ item }}"

    - name: Start git-server
      community.docker.docker_container:
        name: "{{ lab_prefix }}git-server"
        image: localhost/splunk-git-server:latest
        hostname: git-server
        env:
          GITEA__security__SECRET_KEY: "{{ gitea_secret_key }}"
        networks:
          - name: "{{ lab_network }}"
            aliases: [git-server]
        published_ports:
          - "{{ lab_bind_address }}:{{ 2222 + lab_port_offset | int }}:22"
          - "{{ lab_bind_address }}:{{ 8929 + lab_port_offset | int }}:8929"
        volumes:
          - "{{ lab_volume_stem }}gitea-data:/data:rw"
        restart_policy: unless-stopped
        state: started
      when: "'git_server' in groups"

    - name: Wait for containers to be ready
      ansible.builtin.pause:
        seconds: 10
