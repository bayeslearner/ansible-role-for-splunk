---
# Day 0 - Verification
# Fails when a provisioned node is not running Splunk: the service is not active, or a port is closed.
# Can be run directly from the ansible-controller:
#   ansible-playbook /workspace/testing/molecule/day0/verify.yml

- name: Verify Splunk services are running
  hosts: all:!git_server:!ansible_controller
  become: true
  tasks:
    - name: Pick the systemd unit for this node
      ansible.builtin.set_fact:
        splunk_unit: "{{ 'SplunkForwarder' if 'uf' in group_names else 'Splunkd' }}"

    # systemctl prints the state and exits non-zero when it is not "active"; the assert reports it.
    - name: Read the unit's state
      ansible.builtin.command: "systemctl is-active {{ splunk_unit }}"
      register: splunk_unit_state
      changed_when: false
      failed_when: false

    - name: Show why the service is not active
      ansible.builtin.include_tasks: ../tasks/splunk_diagnostics.yml
      vars:
        diag_unit: "{{ splunk_unit }}"
        diag_home: "{{ '/opt/splunkforwarder' if 'uf' in group_names else '/opt/splunk' }}"
      when: splunk_unit_state.stdout | trim != 'active'

    - name: Assert the Splunk service is active
      ansible.builtin.assert:
        that:
          - splunk_unit_state.stdout | trim == 'active'
        success_msg: "{{ splunk_unit }} is active on {{ inventory_hostname }}"
        fail_msg: "{{ splunk_unit }} is {{ splunk_unit_state.stdout | trim | default('unknown', true) }} on {{ inventory_hostname }}"

    - name: Verify Splunk is listening on the management port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 8089
        timeout: 60
      when: "'full' in group_names"

    - name: Verify Splunk Web is listening (search heads)
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 8000
        timeout: 60
      when: "'shcluster' in group_names"

# The cluster plays match no host on small, dev and dms. On prod they wait for the clusters
# day0 converge formed and fail when a member is missing.
- name: Verify the indexer cluster
  hosts: clustermanager
  gather_facts: false
  tasks:
    - name: Wait until every indexer is an Up peer of the manager
      ansible.builtin.uri:
        url: "https://localhost:8089/services/cluster/manager/peers?output_mode=json&count=0"
        user: "{{ splunk_admin_username | default('admin') }}"
        password: "{{ splunk_admin_password }}"
        force_basic_auth: true
        validate_certs: false
      register: lab_idxc_peers
      no_log: true
      until: >-
        lab_idxc_peers.status | default(0) == 200 and
        (lab_idxc_peers.json.entry | selectattr('content.status', 'equalto', 'Up') | list | length)
        == (groups['indexer'] | default([]) | length)
      retries: 30
      delay: 10

    - name: Report the indexer cluster
      ansible.builtin.debug:
        msg: >-
          {{ (lab_idxc_peers.json.entry | map(attribute='content.label') | list | sort | join(', ') ~ ' are Up peers of ' ~ inventory_hostname)
             if lab_idxc_peers.json.entry | length > 0
             else inventory_hostname ~ ' is a cluster manager with no indexers in this topology' }}

- name: Verify the search head cluster
  hosts: shcluster
  gather_facts: false
  tasks:
    - name: Wait until the cluster has a captain and every member is Up
      ansible.builtin.uri:
        url: "https://localhost:8089/services/shcluster/member/members?output_mode=json&count=0"
        user: "{{ splunk_admin_username | default('admin') }}"
        password: "{{ splunk_admin_password }}"
        force_basic_auth: true
        validate_certs: false
      register: lab_shc_members
      no_log: true
      run_once: true  # noqa: run-once[task]  the lab uses Ansible's default linear strategy
      until: >-
        lab_shc_members.status | default(0) == 200 and
        (lab_shc_members.json.entry | selectattr('content.status', 'equalto', 'Up') | list | length)
        == (groups['shcluster'] | length)
      retries: 30
      delay: 10

    - name: Report the search head cluster
      ansible.builtin.debug:
        msg: "{{ lab_shc_members.json.entry | map(attribute='content.label') | list | sort | join(', ') }} are Up members of the search head cluster"
      run_once: true  # noqa: run-once[task]  the lab uses Ansible's default linear strategy

# Informational until the Git server is bootstrapped (spec 05, task 2.3).
- name: Report whether the Git server answers (informational)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check Git server web interface
      ansible.builtin.uri:
        url: "http://git-server:8929"
        method: GET
        status_code: [200, 302]
      register: git_check
      failed_when: false

    - name: Report Git server response
      ansible.builtin.debug:
        msg: "Git server {{ 'answered with ' ~ git_check.status if (git_check.status | default(-1)) in [200, 302] else 'did not answer' }}"
