---
# Day 0 - Splunk Provisioning
# Installs Splunk on target hosts.
# Can be run directly from the ansible-controller:
#   ansible-playbook /workspace/testing/molecule/day0/converge.yml
#
# The role's download_and_unarchive.yml handles software distribution:
#   splunk_download_local: true  → downloads once to localhost, pushes to targets via SCP
#   task download:splunk         → pre-caches tarballs so get_url skips the internet download

# Every node keeps Splunk on the container engine's own disk, and so does everything else that
# engine runs. A Splunk Enterprise install takes about 2.7 GB and needs 1.1 GB more while its
# package unpacks; a full engine disk fails the install and can take other workloads on the same
# engine down with it. This play stops before any install when there is not enough room.
- name: Check the engine has room for the installs
  hosts: all:!ansible_controller:!git_server:!jumpbox
  gather_facts: false
  vars:
    lab_disk_gb_per_enterprise_node: 4
    lab_disk_gb_per_forwarder: 1
    # Left free after the installs: Splunk itself stops indexing below 5 GB free.
    lab_disk_gb_margin: 6
  tasks:
    - name: Check whether Splunk is already installed on this node
      ansible.builtin.stat:
        path: "{{ '/opt/splunkforwarder' if 'uf' in group_names else '/opt/splunk' }}/bin/splunk"
      register: lab_splunk_bin
      become: true

    - name: Note the disk this node's install will need
      ansible.builtin.set_fact:
        lab_needs_gb: >-
          {{ 0 if lab_splunk_bin.stat.exists
             else (lab_disk_gb_per_forwarder if 'uf' in group_names else lab_disk_gb_per_enterprise_node) }}

    - name: Read the free disk under /opt
      ansible.builtin.command: df -Pk /opt
      register: lab_df
      changed_when: false
      run_once: true  # noqa: run-once[task]  the lab uses Ansible's default linear strategy

    - name: Stop when the installs would not fit
      ansible.builtin.assert:
        that:
          - lab_free_gb | float >= lab_total_gb | float
        quiet: true
        fail_msg: >-
          Not enough disk for this topology: {{ lab_free_gb }} GB free under /opt, and installing Splunk on
          {{ ansible_play_hosts | map('extract', hostvars, 'lab_needs_gb') | map('int') | select('gt', 0) | list | length }}
          node(s) needs about {{ lab_total_gb }} GB including a {{ lab_disk_gb_margin }} GB margin.
          Free disk on the container engine, pick a smaller topology (MOLECULE_ENV), or run the lab elsewhere.
      vars:
        lab_free_gb: "{{ ((lab_df.stdout_lines[-1].split()[3] | int) / 1048576) | round(1) }}"
        lab_total_gb: >-
          {{ (ansible_play_hosts | map('extract', hostvars, 'lab_needs_gb') | map('int') | sum) + (lab_disk_gb_margin | int) }}
      run_once: true  # noqa: run-once[task]  the lab uses Ansible's default linear strategy

- name: Install Splunk on target hosts
  hosts: all:!ansible_controller:!git_server:!jumpbox
  serial: 50
  roles:
    - ../../../roles/splunk
  vars:
    deployment_task: check_splunk.yml

# ---------------------------------------------------------------------------
# Cluster formation. An indexer cluster needs a `clustermanager` group and a
# search head cluster needs `shcluster` and `shdeployer`. A topology without
# them (small, dev, dms) may still have an `indexer` group for a standalone
# indexer, so the peer play also checks that a manager exists.
#
# The role's cluster tasks run a `splunk edit` or `splunk init` command that
# fails on a node already configured. Each play first checks the node, so
# `task day0:converge` can be run again on a lab that is already clustered.
# ---------------------------------------------------------------------------

- name: Configure the indexer cluster manager
  hosts: clustermanager
  roles:
    - ../../../roles/splunk
  vars:
    deployment_task: configure_idxc_manager.yml

- name: Join the indexers to the cluster as peers
  hosts: indexer
  tasks:
    - name: Check whether this node already has a clustering stanza
      ansible.builtin.command: grep -q '^\[clustering\]' {{ splunk_home }}/etc/system/local/server.conf
      register: lab_clustering_stanza
      changed_when: false
      failed_when: false
      become: true

    - name: Join the indexer cluster
      ansible.builtin.include_role:
        name: ../../../roles/splunk
      vars:
        deployment_task: configure_idxc_member.yml
      when:
        - groups['clustermanager'] | default([]) | length > 0
        - lab_clustering_stanza.rc != 0

- name: Point the search heads at the indexer cluster
  hosts: shcluster
  tasks:
    - name: Check whether this node already has a clustering stanza
      ansible.builtin.command: grep -q '^\[clustering\]' {{ splunk_home }}/etc/system/local/server.conf
      register: lab_clustering_stanza
      changed_when: false
      failed_when: false
      become: true

    - name: Join the indexer cluster as a search head
      ansible.builtin.include_role:
        name: ../../../roles/splunk
      vars:
        deployment_task: configure_idxc_sh.yml
      when:
        - groups['clustermanager'] | default([]) | length > 0
        - lab_clustering_stanza.rc != 0

- name: Configure the search head cluster deployer
  hosts: shdeployer
  roles:
    - ../../../roles/splunk
  vars:
    deployment_task: configure_shc_deployer.yml

# Each member restarts at the end of this play (the role's handler), which the
# captain bootstrap in the next play needs.
- name: Initialise the search head cluster members
  hosts: shcluster
  tasks:
    - name: Check whether this member is already initialised
      ansible.builtin.command: grep -q '^\[shclustering\]' {{ splunk_home }}/etc/system/local/server.conf
      register: lab_shc_stanza
      changed_when: false
      failed_when: false
      become: true

    - name: Initialise this search head cluster member
      ansible.builtin.include_role:
        name: ../../../roles/splunk
      vars:
        deployment_task: configure_shc_members.yml
      when: lab_shc_stanza.rc != 0

- name: Bootstrap the search head cluster captain
  hosts: shcluster
  tasks:
    - name: Wait for splunkd on every member after its restart
      ansible.builtin.wait_for:
        port: 8089
        timeout: 300

    - name: Check whether the cluster already has a captain
      # This play does not load the role, so the role's default admin user name is spelled out.
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk show shcluster-status -auth {{ splunk_admin_username | default('admin') }}:{{ splunk_admin_password }}"
      register: lab_shc_status
      changed_when: false
      failed_when: false
      no_log: true
      become: true
      become_user: "{{ splunk_nix_user }}"
      run_once: true  # noqa: run-once[task]  the lab uses Ansible's default linear strategy

    - name: Bootstrap the captain
      ansible.builtin.include_role:
        name: ../../../roles/splunk
      vars:
        deployment_task: configure_shc_captain.yml
      # The status command exits 0 on a member that has not joined a cluster yet, so read its words too.
      when: >-
        lab_shc_status.rc != 0 or
        'not part of any cluster' in (lab_shc_status.stdout ~ lab_shc_status.stderr)
