t-id="molrun-line" x="412" y="98" font-size="11.5" fill="var(--cds-text-secondary)">started on demand by task runner:shell</text></g><g data-claude-anchor="runner"><rect x="24" y="144" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="runner-name" x="40" y="168" font-weight="600" fill="var(--cds-text-primary)">molecule-runner, one per command</text><text data-claude-text-id="runner-line" x="40" y="186" font-size="11.5" fill="var(--cds-text-secondary)">runs Molecule and ansible-playbook</text></g><g data-claude-anchor="inventory"><rect x="396" y="144" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="inv-name" x="412" y="168" font-weight="600" fill="var(--cds-text-primary)">Inventory, three layers</text><text data-claude-text-id="inv-line" x="412" y="186" font-size="11.5" fill="var(--cds-text-secondary)">.secrets/inventory, environments/common, &lt;env&gt;</text></g><text data-claude-text-id="read-by" x="574" y="212" font-size="11.5" fill="var(--cds-text-secondary)">read by every scenario</text><g data-claude-anchor="scn-infra"><rect x="24" y="232" width="224" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="infra-name" x="40" y="256" font-weight="600" fill="var(--cds-text-primary)">infra</text><text data-claude-text-id="infra-l1" x="40" y="272" font-size="11.5" fill="var(--cds-text-secondary)">create: one container per host</text><text data-claude-text-id="infra-l2" x="40" y="288" font-size="11.5" fill="var(--cds-text-secondary)">prepare: keys, users, controller</text><text data-claude-text-id="infra-l3" x="40" y="304" font-size="11.5" fill="var(--cds-text-secondary)">verify: systemd, SSH to every node</text></g><g data-claude-anchor="scn-day0"><rect x="264" y="232" width="224" height="72" rx="8" 